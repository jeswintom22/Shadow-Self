<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0e13" />
    <title>Shadow Self</title>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0d0e13;
        color: #e8eaf0;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #boot .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #e8eaf0;
        color: #0d0e13;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot .name {
        font-size: 20px;
        font-weight: 600;
      }
      #boot .bar {
        width: 160px;
        height: 3px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.12);
        overflow: hidden;
      }
      #boot .bar::before {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #9e98ee;
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot-slide {
        from { transform: translateX(-10%); }
        to { transform: translateX(160%); }
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-label="Loading Shadow Self">
        <div class="mark">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </div>
        <div class="name">Shadow Self</div>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
